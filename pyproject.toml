[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sbfg2026"
version = "0.1.0"
description = "Smart Bet Field Guide System 2026 — FIFA World Cup betting analytics platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SBFG2026 Team"}
]
keywords = ["sports-betting", "fifa", "world-cup", "analytics", "football", "soccer"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Topic :: Games/Entertainment :: Sports",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.0",
    "requests>=2.30.0",
    "textual>=0.50.0",
    "tabulate>=0.9.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
analytics = ["matplotlib>=3.7.0", "seaborn>=0.12.0", "plotly>=5.15.0"]
notebook = ["jupyter>=1.0.0"]
dev = ["pytest>=7.0.0", "black>=23.0.0", "ruff>=0.1.0"]

[project.scripts]
sbfg2026 = "src.cli:main"
sbfg2026-tui = "src.tui_app:main"

[project.urls]
Homepage = "https://github.com/yourusername/sbfg2026"
Repository = "https://github.com/yourusername/sbfg2026"
